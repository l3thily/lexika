# Лексика — HTTPS снаружи делает Caddy (restoration-control), он проксирует сюда.
server {
    listen 80;
    server_name lexika.88-218-121-40.sslip.io;
    server_tokens off;
    root /var/www/lexika;
    index index.html;
    if ($http_x_forwarded_proto != "https") { return 301 https://$host$request_uri; }
    gzip on;
    gzip_types text/html text/css application/javascript application/json application/manifest+json image/svg+xml;
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /api/ {
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }
    location = /manifest.webmanifest { default_type application/manifest+json; }
    location / { try_files $uri $uri/ /index.html; }
}
